services:
  db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: seedatlas
      POSTGRES_USER: seedatlas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell or .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - seedatlas-data:/var/lib/postgresql/data
      - ./apps/api/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seedatlas -d seedatlas"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  seedatlas-data:
